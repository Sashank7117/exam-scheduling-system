<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &mdash; Exam Scheduling System</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-wrap">
    <a href="index.html" class="auth-brand">
      <span class="seal">ES</span>
      <span>Exam Scheduling System</span>
    </a>

    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="subtitle" id="subtitle">Verify your identity with your security question, then choose a new password.</p>

      <div id="alertBox" class="alert alert-error" role="alert"></div>
      <div id="successBox" class="alert alert-success" role="status"></div>

      <!-- Step 1: who are you -->
      <form id="lookupForm">
        <div class="field">
          <label for="role">I am resetting the password for</label>
          <select id="role">
            <option value="applicant">An applicant account</option>
            <option value="admin">An administrator account</option>
          </select>
        </div>
        <div class="field">
          <label id="identifierLabel" for="identifier">Email address</label>
          <input type="text" id="identifier" required autocomplete="username">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="lookupBtn">Continue</button>
      </form>

      <!-- Step 2: answer + new password -->
      <form id="resetForm" style="display:none;">
        <div class="field">
          <label id="questionLabel" for="securityAnswer">Security question</label>
          <input type="text" id="securityAnswer" placeholder="Your answer" required autocomplete="off">
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required autocomplete="new-password">
          <div class="hint" id="newPasswordHint">At least 8 characters, with a letter and a number.</div>
        </div>
        <div class="field">
          <label for="confirmNewPassword">Confirm new password</label>
          <input type="password" id="confirmNewPassword" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-gold btn-block" id="resetBtn">Reset Password</button>
        <button type="button" class="btn btn-outline btn-block mt-1" id="backBtn">&larr; Start over</button>
      </form>

      <div class="auth-switch">
        <a href="login.html" id="backToApplicantLogin">&larr; Back to applicant sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
const roleSelect = document.getElementById('role');
const identifierInput = document.getElementById('identifier');
const identifierLabel = document.getElementById('identifierLabel');
const lookupForm = document.getElementById('lookupForm');
const resetForm = document.getElementById('resetForm');
const alertBox = document.getElementById('alertBox');
const successBox = document.getElementById('successBox');
const questionLabel = document.getElementById('questionLabel');
const backToApplicantLogin = document.getElementById('backToApplicantLogin');
const newPasswordHint = document.getElementById('newPasswordHint');

let currentRole = 'applicant';
let currentIdentifier = '';

// Preselect a role from a query string, e.g. reset-password.html?role=admin
const presetRole = new URLSearchParams(window.location.search).get('role');
if (presetRole === 'admin') roleSelect.value = 'admin';

function syncRoleUI() {
  currentRole = roleSelect.value;
  if (currentRole === 'admin') {
    identifierLabel.textContent = 'Admin username';
    identifierInput.placeholder = 'e.g. admin';
    identifierInput.type = 'text';
    backToApplicantLogin.textContent = '← Back to admin sign in';
    backToApplicantLogin.href = 'admin-login.html';
    newPasswordHint.textContent = 'At least 10 characters, with upper & lower case, a number, and a symbol.';
  } else {
    identifierLabel.textContent = 'Email address';
    identifierInput.placeholder = '';
    identifierInput.type = 'email';
    backToApplicantLogin.textContent = '← Back to applicant sign in';
    backToApplicantLogin.href = 'login.html';
    newPasswordHint.textContent = 'At least 8 characters, with a letter and a number.';
  }
}
roleSelect.addEventListener('change', syncRoleUI);
syncRoleUI();

function showError(msg) { alertBox.textContent = msg; alertBox.classList.add('visible'); successBox.classList.remove('visible'); }
function clearAlerts() { alertBox.classList.remove('visible'); successBox.classList.remove('visible'); }

lookupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlerts();

  currentIdentifier = identifierInput.value.trim();
  if (!currentIdentifier) { showError('Please enter your ' + (currentRole === 'admin' ? 'username' : 'email address') + '.'); return; }

  const lookupBtn = document.getElementById('lookupBtn');
  lookupBtn.disabled = true;
  lookupBtn.textContent = 'Checking…';

  try {
    await DB.init();

    const lockout = await Auth.checkLockout(currentRole, currentRole === 'admin' ? currentIdentifier : currentIdentifier.toLowerCase());
    if (lockout.locked) {
      showError(`Too many attempts. Please try again in about ${lockout.minutesRemaining} minute(s).`);
      return;
    }

    const question = await Auth.getSecurityQuestion(currentRole, currentIdentifier);
    if (!question) {
      // Deliberately generic - avoids confirming whether an account exists.
      showError('We could not find a matching account with a security question set up. Double-check the details, or contact an administrator.');
      return;
    }

    questionLabel.textContent = question;
    lookupForm.style.display = 'none';
    resetForm.style.display = 'block';
  } catch (err) {
    showError(err.message || 'Something went wrong.');
  } finally {
    lookupBtn.disabled = false;
    lookupBtn.textContent = 'Continue';
  }
});

document.getElementById('backBtn').addEventListener('click', () => {
  clearAlerts();
  resetForm.style.display = 'none';
  lookupForm.style.display = 'block';
  resetForm.reset();
});

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlerts();

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.disabled = true;
  resetBtn.textContent = 'Resetting…';

  try {
    await Auth.resetPassword(
      currentRole,
      currentIdentifier,
      document.getElementById('securityAnswer').value,
      document.getElementById('newPassword').value,
      document.getElementById('confirmNewPassword').value
    );

    successBox.textContent = 'Password reset successfully. Redirecting to sign in…';
    successBox.classList.add('visible');
    setTimeout(() => {
      window.location.href = currentRole === 'admin' ? 'admin-login.html' : 'login.html';
    }, 1500);
  } catch (err) {
    showError(err.message || 'Could not reset your password.');
  } finally {
    resetBtn.disabled = false;
    resetBtn.textContent = 'Reset Password';
  }
});
</script>

</body>
</html>
